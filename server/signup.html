<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade User Signup</title>
</head>
<body>

<!-- Signup Container -->
<div>
    <h1>Create Your Arcade Account</h1>
    <p>Sign up to access all the fun and games.</p>

    <!-- Signup Form -->
    <form id="signupForm" class="space-y-6">
        <div>
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>

        <div>
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" id="submitButton">Sign Up</button>
    </form>

    <!-- Message Box for Feedback -->
    <div id="messageBox">
        <!-- Messages (success/error) will appear here -->
    </div>

</div>

<!-- JavaScript Logic -->
<script>
    const API_BASE_URL = 'http://localhost:5000'; // Make sure your server is running on this port
    const form = document.getElementById('signupForm');
    const messageBox = document.getElementById('messageBox');
    const submitButton = document.getElementById('submitButton');
    const displayMessage = (message, isError) => {
        messageBox.textContent = message;
    };

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Clear previous message and disable button
        displayMessage('Processing...', false);
        submitButton.disabled = true;

        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const payload = { username, email, password };
        const apiUrl = `${API_BASE_URL}/signup`;

        try {
            const response = await exponentialBackoffFetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (response.ok) {
                // FIXED: Use result.Username to match the response from user.js
                displayMessage(`Success! User ${result.Username} created (Email: ${result.Email}).`, false);
                form.reset(); // Clear the form on success
            } else {
                // Handle server-side validation or internal errors
                const errorMessage = result.error || 'An unknown error occurred during signup.';
                displayMessage(`Signup Failed: ${errorMessage}`, true);
            }
        } catch (error) {
            console.error('Fetch Error:', error);
            displayMessage('Could not connect to the server. Please ensure the Node.js server is running.', true);
        } finally {
            submitButton.disabled = false;
        }
    });
</script>
</body>
</html>
