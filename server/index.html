<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="profile-container">
        <div class="profile-info">
            <div class="profile-picture-container">
                <div class="profile-picture"></div>
                <div class="online-status"></div>
            </div>
            <div class="user-details">
                <div class="display-name">Display Name</div>
                <div class="username">@username</div>
                <div class="bio">This is a placeholder bio.</div>
                <div class="joined-date">Joined: January 1, 2024</div>
            </div>
        </div>
        <div class="badges-container">
            <div class="badge">Badge 1</div>
            <div class="badge">Badge 2</div>
            <div class="badge">Badge 3</div>
            <div class="badge">Badge 4</div>
            <div class="badge">Badge 5</div>
            <div class="badge">Badge 6</div>
            <div class="badge">Badge 7</div>
            <div class="badge">Badge 8</div>
            <div class="badge">Badge 9</div>
            <div class="badge">Badge 10</div>
            <div class="badge">Badge 11</div>
            <div class="badge">Badge 12</div>
            <div class="badge">Badge 13</div>
            <div class="badge">Badge 14</div>
            <div class="badge">Badge 15</div>
        </div>
    </div>
</body>
</html>
